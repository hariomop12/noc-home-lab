# NOC Home Lab — Ansible inventory
#
# Phase 5 placeholder. Devices are added once SSH is reachable from the
# management network. Connection is network_cli via the cisco.ios collection.
#
# Addressing comes from docs/01-ip-plan.md.

[routers]
# R1  ansible_host=10.255.0.1
# R2  ansible_host=10.255.0.2

[switches]
# SW1 ansible_host=10.10.99.11
# SW2 ansible_host=10.10.99.12

[servers]
# SRV-DNS ansible_host=10.100.0.10

[lab:children]
routers
switches
servers

[lab:vars]
ansible_network_os=cisco.ios
ansible_connection=network_cli
ansible_user=admin
# Password comes from ansible-vault, never from this file.
# ansible_password="{{ vault_lab_password }}"
ansible_become=yes
ansible_become_method=enable
ansible_command_timeout=60
