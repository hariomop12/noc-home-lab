# NOC Home Lab — Ansible inventory (Phase 5, abhi placeholder)
#
# Devices tabhi add karo jab SSH reachable ho (mgmt network se).
# Connection: network_cli (cisco.ios collection)

[routers]
# R1 ansible_host=10.255.0.1
# R2 ansible_host=10.255.0.2

[switches]
# SW1 ansible_host=10.10.99.11
# SW2 ansible_host=10.10.99.12

[servers]
# SRV-DNS ansible_host=10.100.0.10

[lab:children]
routers
switches
servers

[lab:vars]
ansible_network_os=cisco.ios
ansible_connection=network_cli
ansible_user=admin
# ansible_password -> ansible-vault se
ansible_become=yes
ansible_become_method=enable
