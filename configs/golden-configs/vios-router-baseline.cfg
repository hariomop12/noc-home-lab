! ==========================================================
! golden-configs/vios-router-baseline.cfg
! GNS3 vios (IOS 15.9) L3 router baseline
! Lab only — password "Cisco123"
!
! Placeholder: <N>   -> device number (R1 = 1, R2 = 2 ...)
!              X/0   -> interface slot/port GNS3 template ke hisaab se
! IP plan: docs/01-ip-plan.md
! ==========================================================

hostname R<N>
no ip domain-lookup
!
! --- Local auth ---
username admin privilege 15 secret Cisco123
enable secret Cisco123
service password-encryption
!
! --- SSH ---
ip domain-name lab.local
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
!
! --- Management plane ---
ntp server 10.100.0.13
logging host 10.100.0.11
logging trap informational
logging buffered 16384
snmp-server community labRO ro
snmp-server community labRW rw
snmp-server location HOME-LAB
snmp-server contact hariom@lab.local
!
! --- Loopback (Router-ID / stable identity) ---
interface Loopback0
 description ROUTER-ID
 ip address 10.255.0.<N> 255.255.255.255
 no shutdown
!
! --- LAN interface (example: HQ VLAN gateway) ---
! interface GigabitEthernetX/0
!  description LAN-HQ
!  ip address 10.10.10.1 255.255.255.0
!  no shutdown
!
! --- WAN interface (example: transit link, 10.0.0.0/30) ---
! interface GigabitEthernetX/1
!  description WAN-R1-R2
!  ip address 10.0.0.1 255.255.255.252
!  no shutdown
!
! --- Base services ---
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
no service pad
!
! --- Consoles ---
line con 0
 logging synchronous
 login local
line aux 0
 no exec
line vty 0 4
 login local
 transport input ssh
 logging synchronous
!
! --- Discovery ---
cdp run
lldp run
!
end
write memory
