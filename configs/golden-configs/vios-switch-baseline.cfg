! ==========================================================
! golden-configs/vios-switch-baseline.cfg
! GNS3 vios_l2 (IOS 15.2SE) L2 switch baseline
! Lab only — password "Cisco123"
!
! Placeholder: <N> -> switch number (SW1 = 1, SW2 = 2 ...)
!              X/0 -> interface slot/port
! IP plan: docs/01-ip-plan.md
!
! NOTE: on vios_l2 the VLAN must be created first, and only then can the
!       access port be assigned to it.
! ==========================================================

hostname SW<N>
no ip domain-lookup
!
! --- VLANs (HQ naming, IP plan se) ---
vlan 10
 name HR
vlan 20
 name SALES
vlan 30
 name IT
vlan 40
 name SERVERS
vlan 99
 name MGMT
!
! --- Management SVI ---
interface Vlan99
 description MGMT
 ip address 10.10.99.1<N> 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.99.1
!
! --- Local auth ---
username admin privilege 15 secret Cisco123
enable secret Cisco123
service password-encryption
!
! --- SSH ---
ip domain-name lab.local
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
!
! --- Management plane ---
ntp server 10.100.0.13
logging host 10.100.0.11
logging trap informational
logging buffered 16384
snmp-server community labRO ro
snmp-server location HOME-LAB
snmp-server contact hariom@lab.local
!
! --- L2 best practice ---
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
!
!.--- Access port template ---
! interface GigabitEthernetX/0
!  description ACCESS-PC1
!  switchport mode access
!  switchport access vlan 10
!  spanning-tree portfast
!  no shutdown
!
! --- Trunk template ---
! interface GigabitEthernetX/3
!  description TRUNK-TO-SW2
!  switchport trunk encapsulation dot1q
!  switchport mode trunk
!  switchport trunk allowed vlan 10,20,30,40,99
!  switchport trunk native vlan 99
!  no shutdown
!
! --- Discovery ---
cdp run
lldp run
!
! --- Consoles ---
line con 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
 logging synchronous
!
end
write memory
