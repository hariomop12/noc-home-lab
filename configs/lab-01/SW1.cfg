! ==========================================================
! configs/lab-01/SW1.cfg
! Lab 01 — Basic LAN (switching, MAC learning, ARP, ICMP)
! Source: show running-config
! Result: SW1 is at DEFAULT config. Nothing was changed.
!   - all four ports are in the default VLAN 1
!   - no VLANs, trunks, SVIs or addressing configured
! This is the point of Lab 01: a switch forwards out of the box,
! purely by learning source MAC addresses.
! ==========================================================

hostname Switch
!
spanning-tree mode pvst
spanning-tree extend system-id
!
interface GigabitEthernet0/0
 negotiation auto
!
interface GigabitEthernet0/1
 negotiation auto
!
interface GigabitEthernet0/2
 negotiation auto
!
interface GigabitEthernet0/3
 negotiation auto
!
ip forward-protocol nd
!
end
