! ==========================================================
! configs/lab-02/R1.cfg
! Lab 02 — Router + 2 LANs
! Source: show running-config (relevant sections)
! Verified: PC1 10.10.10.10 -> PC2 10.10.20.10 ping ttl=63,
!           trace shows hop 1 = 10.10.10.1
! IP plan: docs/01-ip-plan.md
! ==========================================================

hostname R1
!
! --- Stable router identity (OSPF router-id later) ---
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
!
! --- LAN 1 gateway (HR subnet) ---
interface GigabitEthernet0/0
 ip address 10.10.10.1 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
! --- LAN 2 gateway (SALES subnet) ---
interface GigabitEthernet0/1
 ip address 10.10.20.1 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ipv6 ioam timestamp
!
end
