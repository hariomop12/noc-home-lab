! ==========================================================
! configs/lab-03/R1.cfg
! Lab 03 — VLAN + trunk + inter-VLAN (router-on-a-stick)
! Source: show running-config (relevant sections)
! Verified: inter-VLAN ping 10.10.10.100 -> 10.10.20.100
! IP plan: docs/01-ip-plan.md
! ==========================================================

interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
! --- VLAN 10 gateway (HR) ---
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
!
! --- VLAN 20 gateway (SALES) ---
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
!
interface GigabitEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ipv6 ioam timestamp
!
end
