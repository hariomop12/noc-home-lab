! ==========================================================
! configs/lab-03/SW1.cfg
! Lab 03 — VLAN + trunk + inter-VLAN (access ports + trunk)
! Source: show running-config (relevant sections)
! Verified: inter-VLAN ping through the trunk
! IP plan: docs/01-ip-plan.md
! ==========================================================

interface GigabitEthernet0/0
 negotiation auto
!
! --- Access port to PC1 (VLAN 10) ---
interface GigabitEthernet0/1
 switchport access vlan 10
 switchport mode access
 negotiation auto
!
! --- Access port to PC2 (VLAN 20) ---
interface GigabitEthernet0/2
 switchport access vlan 20
 switchport mode access
 negotiation auto
!
! --- Trunk uplink to R1 ---
interface GigabitEthernet0/3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 negotiation auto
!
ip forward-protocol nd
!
end
