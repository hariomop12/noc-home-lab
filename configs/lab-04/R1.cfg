! ==========================================================
! configs/lab-04/R1.cfg
! Lab 04 — DHCP + DNS + HTTP
! Source: show running-config (relevant sections)
! Verified: PC1 got 10.10.10.160/24 via relayed DORA,
!           ping 10.100.0.1 ok, ping web.lab.local ok (ttl=63)
! IP plan: docs/01-ip-plan.md
! ==========================================================

! --- Trunk to SW1 (VLAN 10) ---
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
! --- VLAN 10 gateway + DHCP relay ---
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip helper-address 10.100.0.10
!
! --- Server LAN gateway (10.100.0.0/24) ---
interface GigabitEthernet0/1
 ip address 10.100.0.1 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ipv6 ioam timestamp
!
end
