! ==========================================================
! configs/lab-05/R1.cfg
! Lab 05 — Network Management (SSH + NTP + Syslog + SNMP)
! Source: show running-config (relevant sections)
! Verified: SSH only (22 open / 23 closed), NTP synced to
!           SRV-NTP (stratum 11), syslog arriving at SRV-SYSLOG,
!           SNMPv2c answers labRO and ignores a wrong community
! IP plan: docs/01-ip-plan.md
! ==========================================================

! --- Local auth: one admin account, no vty password ---
username admin privilege 15 secret 9 $9$dSZReBYdmd/8AP$pqutmlZpbRq06R3tYUF66mDp.v5N.Da4oJAmfi/8sqw
enable secret 9 $9$fhdAjS8PLaw9Uf$oNWFliz.CggPlV50D.cTCXIALbt4TxN7.nImzWrHooM
service password-encryption
!
! --- SSH: version 2 only, name needed for the RSA key ---
ip domain name lab.local
ip ssh version 2
!
! --- Management plane: time, logs, polling ---
ntp server 10.100.0.13
!
logging host 10.100.0.11
logging buffered 16384
!
snmp-server community labRO RO
snmp-server community labRW RW
snmp-server location HOME-LAB
snmp-server contact hariom@lab.local
!
! --- Router identity (stable source for NTP/syslog/SNMP) ---
interface Loopback0
 description ROUTER-ID
 ip address 10.255.0.1 255.255.255.255
!
! --- LAN gateway ---
interface GigabitEthernet0/0
 description LAN-HQ
 ip address 10.10.10.1 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
! --- Servers / management segment gateway ---
interface GigabitEthernet0/1
 description SERVERS-LAN
 ip address 10.100.0.1 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
! --- Unused ports stay administratively down ---
interface GigabitEthernet0/2
 no ip address
 shutdown
!
interface GigabitEthernet0/3
 no ip address
 shutdown
!
! --- Lock every access line to local auth; vty is SSH-only ---
line con 0
 logging synchronous
 login local
line aux 0
 no exec
line vty 0 4
 logging synchronous
 login local
 transport input ssh
!
end
