! ==========================================================
! configs/lab-05/SW1.cfg
! Lab 05 — Network Management (SSH + NTP + Syslog + SNMP)
! Source: show running-config (relevant sections)
! Note: SW1 is L2-only in this lab — it just carries VLAN 10.
!       It has no management SVI, so it does not speak SSH,
!       NTP, syslog or SNMP yet; that arrives in lab 06.
! IP plan: docs/01-ip-plan.md
! ==========================================================

! (hostname left as the default "Switch" — rename when SW1
!  gets a management address in lab 06)

spanning-tree mode pvst
!
interface GigabitEthernet0/0
 negotiation auto
!
! --- Access port to PC1 (VLAN 10) ---
interface GigabitEthernet0/1
 switchport access vlan 10
 switchport mode access
 negotiation auto
!
! --- Uplink to R1 Gi0/0 (also VLAN 10) ---
interface GigabitEthernet0/2
 switchport access vlan 10
 switchport mode access
 negotiation auto
!
interface GigabitEthernet0/3
 negotiation auto
!
end
