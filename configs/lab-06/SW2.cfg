! ==========================================================
! configs/lab-06/SW2.cfg
! Lab 06 — HQ access switch (VLANs, trunk, server segment)
! Source: copy running-config tftp://10.100.0.50/SW2.cfg
! Verified: VLANs 10/20/30/40/99, 802.1Q trunk, mgmt SVI
! IP plan: docs/01-ip-plan.md
! ==========================================================

!
! Last configuration change at 05:12:07 UTC Fri Oct 16 2026 by admin
!
version 15.2
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
service compress-config
!
hostname SW2
!
boot-start-marker
boot-end-marker
!
!
logging buffered 16384
enable secret 5 $1$H5BF$G6JgMlyS4qc217uZdZ5Si/
!
username admin privilege 15 secret 5 $1$Buqn$pVfl1ZFeJ6VRlnenas6Pd.
no aaa new-model
!
!
!
!
!
!
!
!
no ip domain-lookup
ip domain-name lab.local
ip cef
no ipv6 cef
!
!
!
spanning-tree mode rapid-pvst
spanning-tree portfast edge default
spanning-tree portfast edge bpduguard default
spanning-tree extend system-id
!
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface GigabitEthernet0/0
 description TRUNK-TO-SW1
 switchport trunk allowed vlan 10,20,30,40,99
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 negotiation auto
!
interface GigabitEthernet0/1
 description PC3-IT
 switchport access vlan 30
 switchport mode access
 negotiation auto
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/2
 description PC4-IT
 switchport access vlan 30
 switchport mode access
 negotiation auto
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/3
 description TO-SRV-SEG
 switchport access vlan 40
 switchport mode access
 negotiation auto
 spanning-tree portfast edge
!
interface Vlan99
 description MGMT
 ip address 10.10.99.12 255.255.255.0
!
ip default-gateway 10.10.99.1
ip forward-protocol nd
!
ip http server
ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 10.10.99.1
ip ssh version 2
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
ip access-list standard MGMT-ACCESS
 permit 10.10.30.0 0.0.0.255
 permit 10.10.99.0 0.0.0.255
 deny   any log
!
!
logging host 10.100.0.11
!
!
!
snmp-server community labRO RO
snmp-server location HOME-LAB
snmp-server contact hariom@lab.local
!
control-plane
!
