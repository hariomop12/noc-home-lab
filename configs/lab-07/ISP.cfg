
!
! No configuration change since last restart
!
version 15.9
no service pad
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
!
hostname ISP
!
boot-start-marker
boot-end-marker
!
!
logging buffered 16384
enable secret 9 $9$tquvp/x.Lvq3.9$0Kr6mm4igEzNqlPbds9hxvCCDEpbvnrG5coAwnnD.fY
!
no aaa new-model
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
username admin privilege 15 secret 9 $9$qiKFWKHk801Lhf$ypyrMFqYmBhmuu/pZOqsf/addHTlhq.DFjE/1r6SjbE
!
redundancy
!
lldp run
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 description ISP-ID
 ip address 100.64.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description WAN-TO-R1
 ip address 10.0.0.14 255.255.255.252
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 description LINK-TO-SRV-NET
 ip address 200.1.1.1 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 description WAN-TO-R2
 ip address 10.0.0.18 255.255.255.252
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
router ospf 1
 router-id 100.64.0.1
 network 10.0.0.12 0.0.0.3 area 0
 network 10.0.0.16 0.0.0.3 area 0
 network 100.64.0.1 0.0.0.0 area 0
 default-information originate always
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip ssh version 2
!
ip access-list standard MGMT-ACCESS
 permit 10.10.30.0 0.0.0.255
 permit 10.10.99.0 0.0.0.255
 permit 10.20.99.0 0.0.0.255
 deny   any log
!
logging host 10.100.0.11
ipv6 ioam timestamp
!
snmp-server community labRO RO
snmp-server community labRW RW
snmp-server location HOME-LAB
snmp-server contact hariom@lab.local
snmp-server chassis-id 
!
!
control-plane
!
banner exec 
