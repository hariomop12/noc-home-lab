!
line con 0
 logging synchronous
 login local
line aux 0
 no exec
line vty 0 4
 access-class MGMT-ACCESS in
 logging synchronous
 login local
 transport input ssh
!
no scheduler allocate
ntp server 10.100.0.13
!
end
