 description BR1-USERS
 encapsulation dot1Q 10
 ip address 10.20.10.1 255.255.255.0
 ip helper-address 10.100.0.10
 ip nat inside
 ip virtual-reassembly in
!
interface GigabitEthernet0/0.99
 description MGMT
