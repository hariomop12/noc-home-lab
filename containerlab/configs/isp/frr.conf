frr version 10.7.1
frr defaults traditional
hostname isp
log syslog informational
service integrated-vtysh-config
!
! ============================================================================
!  The simulated ISP.
!
!   eth1  10.0.0.14/30   WAN to r1  (HQ)
!   eth2  10.0.0.18/30   WAN to r2  (BR1)
!   eth3  200.1.1.1/24   the "public internet", one web server on it
!   lo    100.64.0.1/32  router-id
!
!  It originates the default route into OSPF, exactly like Lab 07: the sites
!  learn 0.0.0.0/0 as O*E2 instead of being handed a static default.
! ============================================================================
!
interface lo
 ip address 100.64.0.1/32
!
interface eth1
 description WAN to r1 (HQ)
 ip address 10.0.0.14/30
!
interface eth2
 description WAN to r2 (BR1)
 ip address 10.0.0.18/30
!
interface eth3
 description internet edge
 ip address 200.1.1.1/24
!
router ospf
 ospf router-id 100.64.0.1
 network 10.0.0.12/30 area 0
 network 10.0.0.16/30 area 0
 network 100.64.0.1/32 area 0
 default-information originate always
!
ip route 0.0.0.0/0 Null0
!
line vty
!
