# DHCP relay on r1 - the FRR/containerland equivalent of
# `ip helper-address 10.100.0.10` on each gateway sub-interface.
#
# The local address in each pair is the interface the broadcast arrives on, so
# the relayed request carries giaddr = that gateway address and the server in
# VLAN 40 selects the matching scope from it. That is exactly the mechanism
# Lab 04 and Lab 06 document.
dhcp-relay=10.10.10.1,10.100.0.10
dhcp-relay=10.10.20.1,10.100.0.10
dhcp-relay=10.10.30.1,10.100.0.10

# No DNS service on this box: it only relays DHCP.
port=0
no-resolv
no-hosts
log-dhcp
