frr version 10.7.1
frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
! ============================================================================
!  HQ edge router (Lab 06 + Lab 07 roles in one box).
!
!   eth1     10.0.0.13/30   WAN to ISP          (the only NAT outside link)
!   eth2     trunk to sw1   VLANs 10,20,30,40,99
!   eth2.10  10.10.10.1/24  HR
!   eth2.20  10.10.20.1/24  SALES
!   eth2.30  10.10.30.1/24  IT
!   eth2.40  10.100.0.1/24  SERVERS / NOC
!   eth2.99  10.10.99.1/24  MGMT
!   eth3     10.0.0.1/30    transit to r2 (BR1)
!   lo       10.255.0.1/32  router-id
!
!  OSPF is one area (area 0) and every LAN sub-interface is passive: the only
!  adjacencies are the WAN link and the branch transit. That is the "keep it
!  simple" rule the roadmap sets for Phase 3.
! ============================================================================
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 description WAN to ISP
 ip address 10.0.0.13/30
 ip ospf cost 1
!
interface eth2
 description trunk to sw1
!
interface eth2.10
 description HQ VLAN 10 - HR
 ip address 10.10.10.1/24
!
interface eth2.20
 description HQ VLAN 20 - SALES
 ip address 10.10.20.1/24
!
interface eth2.30
 description HQ VLAN 30 - IT
 ip address 10.10.30.1/24
!
interface eth2.40
 description HQ VLAN 40 - SERVERS
 ip address 10.100.0.1/24
!
interface eth2.99
 description HQ VLAN 99 - MGMT
 ip address 10.10.99.1/24
!
interface eth3
 description transit to r2
 ip address 10.0.0.1/30
 ip ospf cost 10
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.1
 passive-interface default
 no passive-interface eth1
 no passive-interface eth3
 network 10.0.0.0/30 area 0
 network 10.0.0.12/30 area 0
 network 10.10.0.0/16 area 0
 network 10.100.0.0/16 area 0
 network 10.255.0.1/32 area 0
!
line vty
!
