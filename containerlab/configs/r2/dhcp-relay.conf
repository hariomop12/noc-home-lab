# DHCP relay on r2 for the branch users. The request arrives on the BR1 user
# VLAN, is relayed to the HQ server in VLAN 40 two hops away, and the server
# picks the 10.20.10.0/24 scope from giaddr = 10.20.10.1.
dhcp-relay=10.20.10.1,10.100.0.10

# No DNS service on this box: it only relays DHCP.
port=0
no-resolv
no-hosts
log-dhcp
