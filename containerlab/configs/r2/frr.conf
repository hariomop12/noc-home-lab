frr version 10.7.1
frr defaults traditional
hostname r2
log syslog informational
service integrated-vtysh-config
!
! ============================================================================
!  Branch-1 edge router (Lab 07).
!
!   eth1     10.0.0.17/30   WAN to ISP        (the only NAT outside link)
!   eth2     trunk to sw3   VLANs 10,99
!   eth2.10  10.20.10.1/24  BR1 users
!   eth2.99  10.20.99.1/24  BR1 management
!   eth3     10.0.0.2/30    transit to r1 (HQ)
!   lo       10.255.0.2/32  router-id
!
!  HQ is one hop away over the transit and two hops away over the ISP, so the
!  transit wins on hop count with no cost tuning. Same result as Lab 07.
! ============================================================================
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 description WAN to ISP
 ip address 10.0.0.17/30
 ip ospf cost 1
!
interface eth2
 description trunk to sw3
!
interface eth2.10
 description BR1 VLAN 10 - USERS
 ip address 10.20.10.1/24
!
interface eth2.99
 description BR1 VLAN 99 - MGMT
 ip address 10.20.99.1/24
!
interface eth3
 description transit to r1
 ip address 10.0.0.2/30
 ip ospf cost 10
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.2
 passive-interface default
 no passive-interface eth1
 no passive-interface eth3
 network 10.0.0.0/30 area 0
 network 10.0.0.16/30 area 0
 network 10.20.0.0/16 area 0
 network 10.255.0.2/32 area 0
!
line vty
!
