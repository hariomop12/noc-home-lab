# dnsmasq configuration for the lab
# Address ranges come from docs/01-ip-plan.md
#
# VLAN 10, 20 and 30 all have a range. Lab 04 only needed VLAN 10; Lab 06
# runs all three departments, so every range is live here.

# ---- DNS -------------------------------------------------------------

# Do not forward queries for names that have no dot in them.
domain-needed

# Never forward reverse lookups for private ranges upstream.
bogus-priv

# Do not read /etc/resolv.conf; upstream servers are declared here.
no-resolv

# Real upstream, so the lab can still resolve the internet if it is reachable.
server=1.1.1.1
server=9.9.9.9

# Everything under lab.local is answered locally and never forwarded.
local=/lab.local/
address=/web.lab.local/10.100.0.12
address=/dns.lab.local/10.100.0.10
address=/zabbix.lab.local/10.100.0.20
address=/r1.lab.local/10.255.0.1
address=/sw1.lab.local/10.10.99.11
address=/sw2.lab.local/10.10.99.12

# Wildcard for quick name tests: any other *.lab.local resolves to the web server.
address=/.lab.local/10.100.0.12

# A large cache costs nothing here and makes repeat queries visibly faster.
cache-size=1000

# ---- DHCP ------------------------------------------------------------

# VLAN 10 - HR  (10.10.10.0/24, gateway 10.10.10.1)
# Served through the router's DHCP relay, so the request arrives with
# giaddr = 10.10.10.1 and dnsmasq selects this range from that.
dhcp-range=set:vlan10,10.10.10.100,10.10.10.200,255.255.255.0,12h
dhcp-option=tag:vlan10,option:router,10.10.10.1
dhcp-option=tag:vlan10,option:dns-server,10.100.0.10
dhcp-option=tag:vlan10,option:domain-name,lab.local
dhcp-option=tag:vlan10,option:ntp-server,10.100.0.13
dhcp-option=tag:vlan10,option:domain-search,lab.local

# VLAN 20 - SALES (10.10.20.0/24, gateway 10.10.20.1)
dhcp-range=set:vlan20,10.10.20.100,10.10.20.200,255.255.255.0,12h
dhcp-option=tag:vlan20,option:router,10.10.20.1
dhcp-option=tag:vlan20,option:dns-server,10.100.0.10
dhcp-option=tag:vlan20,option:domain-name,lab.local
dhcp-option=tag:vlan20,option:ntp-server,10.100.0.13
dhcp-option=tag:vlan20,option:domain-search,lab.local

# VLAN 30 - IT (10.10.30.0/24, gateway 10.10.30.1)
dhcp-range=set:vlan30,10.10.30.100,10.10.30.200,255.255.255.0,12h
dhcp-option=tag:vlan30,option:router,10.10.30.1
dhcp-option=tag:vlan30,option:dns-server,10.100.0.10
dhcp-option=tag:vlan30,option:domain-name,lab.local
dhcp-option=tag:vlan30,option:ntp-server,10.100.0.13
dhcp-option=tag:vlan30,option:domain-search,lab.local

# Lease the same address to the same MAC where possible.
dhcp-authoritative

# ---- Logging ---------------------------------------------------------
# Verbose on purpose: the point of this box is to be watched.
log-queries
log-dhcp
