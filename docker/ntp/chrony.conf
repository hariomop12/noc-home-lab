# chrony configuration for the lab NTP server (SRV-NTP).
#
# The lab is offline, so there is no upstream to sync from. `local stratum 10`
# makes chrony serve its own clock to the network as a valid source, which is
# exactly what a device needs in order to test NTP sync.
#
# If you later give the lab an upstream (or run it with internet access),
# uncomment the pool line and network devices will sync to real time.

#pool pool.ntp.org iburst

driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony

# Serve time to the whole lab subnet.
allow all

# Act as a stratum-10 source even without an upstream.
local stratum 10

# Bind on all interfaces.
bindaddress 0.0.0.0
