# rsyslog configuration for the lab syslog collector
#
# Goal: accept syslog from every network device and split it into one file per
# source address, so that "what did R1 log at 14:02" is a single command away.

module(load="imuxsock")   # local socket
module(load="imudp")      # UDP syslog - the classic network device transport
module(load="imtcp")      # TCP syslog - reliable, use where supported

input(type="imudp" port="514")
input(type="imtcp" port="514")

# Keep the local journal behaviour simple and predictable.
*.* /var/log/all.log

# One file per sending device, named by source IP.
# This is a template, not a rule: comparison can be turned on with
# `compare` or `startswith` if wildcard names are preferred.
template(name="PerHostFile" type="string"
         string="/var/log/remote/%FROMHOST-IP%.log")

# Everything received from the network goes into the per-host file.
if $fromhost-ip != "127.0.0.1" then {
    action(type="omfile" dynaFile="PerHostFile")
    stop
}

# Emergency messages everywhere, logged locally too.
*.emerg /var/log/emergency.log
